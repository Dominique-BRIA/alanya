# ⚠️ NE PAS remettre de `org.gradle.*` ici. Quatre propriétés y figuraient
# (daemon, parallel, caching, jvmargs) et Gradle ne les a JAMAIS lues : ce
# fichier ne configure que le téléchargement du wrapper, rien d'autre. Elles
# donnaient l'illusion d'un réglage mémoire à 4096 Mo alors que le vrai, dans
# gradle.properties, valait 8 Go — d'où la confusion « gradle.properties a Xmx8G
# mais le wrapper 4096m ». Toute propriété Gradle va dans gradle.properties.
