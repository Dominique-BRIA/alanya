# Mémoire de la JVM Gradle.
#
# ⚠️ NE PAS REMONTER SANS MESURER. La valeur d'avant était -Xmx8G avec un
# MaxMetaspaceSize de 4G, soit 12 Go réclamés par le seul démon Gradle — plus
# que la RAM du runner GitHub, qui en a 7 (dépôt privé) ou 16 (dépôt public).
# La JVM démarrait quand même, `Xmx` étant un plafond et non une réservation,
# puis le système partait en swap dès que R8 et le démon Kotlin montaient en
# charge. D'où un `assembleRelease` à 877 s au lieu de quelques minutes, qui
# finissait tué par la limite de temps du job (exit 143 = SIGTERM).
#
# Demander MOINS de mémoire rend donc le build PLUS rapide : c'est
# contre-intuitif, mais le swap coûte bien plus cher que le ramasse-miettes.
# 4 Go suffisent largement pour R8 sur ce projet. Un metaspace de 4 Go n'avait
# aucune justification : il dépasse rarement 512 Mo.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# « Caught exception: Already watching path » vient de là. Le suivi du système
# de fichiers sert à accélérer les builds INCRÉMENTAUX en gardant l'état entre
# deux exécutions ; sur un runner CI jetable, il n'y a pas de build suivant à
# accélérer. Il ne reste que le coût et cet avertissement.
org.gradle.vfs.watch=false

# Utile dès que le workflow sait conserver le cache entre deux exécutions.
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
