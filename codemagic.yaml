workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60

    environment:
      # ⚠️ MEME VERSION QUE `.circleci/config.yml`,
      # `.github/workflows/build-android.yml` et le poste de developpement.
      # 3.24.5 ne suffit plus : `flutter_foreground_task 10.0.0` exige
      # `flutter: ">=3.38.0"` et `pub get` echoue des la resolution.
      flutter: 3.44.6
      java: 17
      # Les variables globales (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_PASSWORD) configurées dans l'IHM — PAS l'alias, voir plus bas
      # sont automatiquement injectées ici sans avoir besoin de la section groups.

    scripts:
      - name: Get dependencies
        script: |
          flutter pub get

      - name: Patch Plugins SDK Overrides
        script: |
          echo "=== Modification des plugins dans le pub cache ==="
          
          # Force compileSdkVersion 36 dans les fichiers build.gradle (Groovy) des plugins tiers
          find $PUB_CACHE -name "build.gradle" -exec sed -i '' 's/compileSdkVersion .*/compileSdkVersion 36/g' {} + 2>/dev/null || \
          find $PUB_CACHE -name "build.gradle" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' {} +
          
          # Force compileSdk/compileSdkVersion dans les fichiers build.gradle.kts (Kotlin) des plugins tiers
          find $PUB_CACHE -name "build.gradle.kts" -exec sed -i '' 's/compileSdk = .*/compileSdk = 36/g' {} + 2>/dev/null || \
          find $PUB_CACHE -name "build.gradle.kts" -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} +
          find $PUB_CACHE -name "build.gradle.kts" -exec sed -i '' 's/compileSdkVersion = .*/compileSdkVersion = 36/g' {} + 2>/dev/null || \
          find $PUB_CACHE -name "build.gradle.kts" -exec sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/g' {} +

          echo "=== Vérification et alignement de l'application principale ==="
          # S'assure que ton application utilise bien compileSdk = 36
          sed -i '' 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts 2>/dev/null || \
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts

      - name: Signature stable
        script: |
          set -eu
          
          # Vérification de la présence de la clé
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERREUR: La variable ANDROID_KEYSTORE_BASE64 est introuvable."
            exit 1
          fi

          # ⚠️ ALIAS EN CLAIR, jamais en variable de projet. Un alias n'est pas
          # confidentiel — il est écrit dans `key.properties` et lisible dans la
          # signature de tout APK publié. En variable, sa valeur (« alanya »,
          # soit le nom du dépôt) était remplacée par `***` dans TOUS les
          # journaux, y compris les liens d'artefact, qui devenaient
          # inutilisables.
          KEY_ALIAS="alanya"

          # Décodage du keystore Base64 dans android/app/alanya-release.jks
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/alanya-release.jks

          # Vérification immédiate de la validité du fichier keystore et de l'alias
          keytool -list -keystore android/app/alanya-release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null

          # Génération du fichier key.properties lu par Gradle
          cat > android/key.properties <<PROPS
          storeFile=alanya-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

          echo "Cle de signature en place avec succès."

      - name: Build APK release
        script: |
          # --split-per-abi : produit des APKs séparés (arm64-v8a, armeabi-v7a, x86_64)
          #
          # MAPTILER_KEY : variable d'environnement Codemagic (les dépôts sont
          # publics, la clé ne peut pas vivre dans le code). Absente, le build
          # réussit et l'APK n'a pas de carte — c'est voulu, pas un repli
          # silencieux sur OpenStreetMap, que leur politique interdit.
          flutter build apk --release --split-per-abi \
            --dart-define=MAPTILER_KEY="$MAPTILER_KEY" \
            --android-skip-build-dependency-validation

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - d.bria00@gmail.com
        notify:
          success: true
          failure: true
