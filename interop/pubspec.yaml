name: alanya_interop
description: >-
  Banc d'interopérabilité entre la bibliothèque Signal du WEB (TypeScript) et
  celle du MOBILE (Dart). Paquet Dart PUR — il ne dépend pas de Flutter, et
  tourne donc sans construire d'APK.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  libsignal_protocol_dart: ^0.8.2
