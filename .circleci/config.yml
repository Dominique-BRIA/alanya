# ============================================================
# CircleCI — Build APK Alanya
#
# Variables d'environnement à définir dans :
#   CircleCI → Project Settings → Environment Variables
#
#   ANDROID_KEYSTORE_BASE64   → cat alanya-release.jks | base64 -w 0
#   ANDROID_KEYSTORE_PASSWORD → mot de passe du keystore
#   ANDROID_KEY_PASSWORD      → mot de passe de la clé
#
# ⚠️ PAS `ANDROID_KEY_ALIAS` : un alias n'est pas un secret. Il est écrit en
# clair dans `key.properties` et lisible dans la signature de tout APK publié.
# Le déclarer en variable de projet a un coût réel : CircleCI comme GitHub
# remplacent par `***` toute occurrence de la valeur dans les journaux — et
# celle-ci vaut « alanya », donc le nom du dépôt. Les liens d'artefact
# sortaient en `github.com/Dominique-BRIA/***/…` et renvoyaient une page
# introuvable. L'alias est donc écrit en clair plus bas.
# ============================================================
version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.01
    environment:
      # build.gradle.kts lit GITHUB_RUN_NUMBER pour le versionCode
      # auto-incrémenté. Sans lui, deux builds produisent le même numéro et le
      # second APK refuse de s'installer par-dessus le premier.
      GITHUB_RUN_NUMBER: << pipeline.number >>
    steps:
      - checkout

      # ── 1. Flutter ─────────────────────────────────────────
      # ⚠️ VERSION ÉPINGLÉE, pas `stable`. Avec `-b stable`, le même commit
      # produit un APK différent d'un mois à l'autre, et le jour où `stable`
      # casse quelque chose, rien dans le dépôt ne dit quelle version marchait.
      #
      # 3.44.6 est la version de `.github/workflows/build-android.yml` et de
      # `codemagic.yaml`. Les trois doivent bouger ENSEMBLE : c'est l'écart
      # entre elles qui a cassé le build précédent — `flutter_foreground_task`
      # exige `flutter >= 3.38.0`, et cette CI était restée à 3.24.5.
      - run:
          name: Installer Flutter 3.44.6
          command: |
            set -euo pipefail
            git clone https://github.com/flutter/flutter.git \
              -b 3.44.6 --depth 1 "$HOME/flutter"
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            flutter --version

      # ── 2. CMake et Ninja ──────────────────────────────────
      # `path_provider_android` dépend de `jni`, qui compile du natif via
      # `externalNativeBuild { cmake }`. L'image fournit un `cmake` système mais
      # PAS `ninja`, générateur par défaut du plugin Gradle Android — d'où
      # « [CXX1416] Could not find Ninja on PATH or in SDK CMake bin folders ».
      # Le CMake du SDK Android embarque Ninja dans son propre `bin/`.
      - run:
          name: Installer CMake 3.22.1 (fournit Ninja)
          command: |
            set -euo pipefail
            SDK="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDK" --licenses || true
            "$SDK" "cmake;3.22.1"

      # ── 3. NDK ─────────────────────────────────────────────
      # ⚠️ INDISPENSABLE : `android/app/build.gradle.kts` déclare
      # `ndkVersion = "28.2.13676358"`. Sans cette étape, Gradle le télécharge
      # lui-même à CHAQUE build — près de 3 Go — ou échoue si la licence n'a pas
      # été acceptée. Le déclarer ici le rend explicite et cacheable.
      - run:
          name: Installer NDK 28.2.13676358
          command: |
            set -euo pipefail
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;28.2.13676358"

      # ── 4. Dépendances Dart ────────────────────────────────
      - restore_cache:
          keys:
            - pub-cache-v3-{{ checksum "pubspec.lock" }}
            - pub-cache-v3-

      - run:
          name: flutter pub get
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            flutter pub get

      - save_cache:
          key: pub-cache-v3-{{ checksum "pubspec.lock" }}
          paths:
            - ~/.pub-cache

      # ── 5. Aligner le compileSdk des plugins tiers ─────────
      # ⚠️ À FAIRE APRÈS `pub get` — le pub cache n'existe pas avant — et AVANT
      # le build. Les plugins publiés figent chacun leur `compileSdk` ; quand
      # l'un reste à 34 ou 35 alors que l'application est à 36, la fusion des
      # manifestes échoue sur un conflit que rien n'explique clairement.
      - run:
          name: Patch compileSdk 36 sur les plugins tiers
          command: |
            set -euo pipefail
            PUB="${HOME}/.pub-cache"

            find "$PUB" -name "build.gradle" \
              -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' {} +
            find "$PUB" -name "build.gradle.kts" \
              -exec sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' {} +
            find "$PUB" -name "build.gradle.kts" \
              -exec sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' {} +

            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' \
              android/app/build.gradle.kts
            echo "Patch terminé."

      # ── 6. Signature release ───────────────────────────────
      # 🔴 SANS CETTE ÉTAPE LE BUILD NE CASSE PAS — IL MENT. `build.gradle.kts`
      # retombe volontairement sur la clé DEBUG quand `key.properties` est
      # absent. L'APK se construit, mais il est signé d'une clé qui change à
      # chaque machine : il s'installe À CÔTÉ du précédent au lieu de le mettre
      # à jour, et n'est publiable nulle part. Un échec silencieux, donc le pire.
      - run:
          name: Configurer la signature release
          command: |
            set -euo pipefail

            # Alias en clair, jamais en variable de projet : voir l'en-tête du
            # fichier. Il doit reprendre EXACTEMENT ce que renvoie
            #   keytool -list -keystore alanya-release.jks
            # et non ce qu'on croit avoir tapé à la création : un magasin PKCS12
            # préserve la casse, un JKS met tout en minuscules.
            KEY_ALIAS="alanya"

            if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
              echo "ERREUR : ANDROID_KEYSTORE_BASE64 est absent."
              echo "CircleCI → Project Settings → Environment Variables."
              exit 1
            fi

            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
              > android/app/alanya-release.jks

            # Échoue TÔT si l'alias ne correspond pas : sans ce contrôle,
            # l'erreur n'apparaîtrait qu'à la fin du build, après dix minutes.
            # -alias est ESSENTIEL, pas seulement -storepass : sans lui le
            # contrôle passe, et Gradle échoue bien plus tard sur
            # « No key with alias found ».
            keytool -list \
              -keystore android/app/alanya-release.jks \
              -alias "$KEY_ALIAS" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null

            # storeFile est relatif à android/app/ (lu par build.gradle.kts).
            cat > android/key.properties << PROPS
            storeFile=alanya-release.jks
            storePassword=${ANDROID_KEYSTORE_PASSWORD}
            keyAlias=${KEY_ALIAS}
            keyPassword=${ANDROID_KEY_PASSWORD}
            PROPS

            echo "Clé de signature en place."

      # ── 7. Build ───────────────────────────────────────────
      # `--split-per-abi` : trois APK légers au lieu d'un APK universel de
      # ~100 Mo. C'est celui en `arm64-v8a` qui s'installe sur un téléphone
      # récent.
      - restore_cache:
          keys:
            - gradle-v3-{{ checksum "android/app/build.gradle.kts" }}
            - gradle-v3-

      - run:
          name: flutter build apk --release --split-per-abi
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            # MAPTILER_KEY : variable de projet CircleCI. Les deux dépôts sont
            # PUBLICS, la clé des tuiles ne peut donc pas vivre dans le code.
            # `${MAPTILER_KEY:-}` : sans la variable, `set -u` ferait échouer
            # tout le build pour une carte manquante. L'APK sort alors sans
            # carte — visible, et sans repli sur OpenStreetMap, que leur
            # politique interdit à une application distribuée.
            flutter build apk --release --split-per-abi \
              --dart-define=MAPTILER_KEY="${MAPTILER_KEY:-}"
          no_output_timeout: 30m

      - save_cache:
          key: gradle-v3-{{ checksum "android/app/build.gradle.kts" }}
          paths:
            - ~/.gradle

      # ── 8. Artefacts ───────────────────────────────────────
      # Le DOSSIER, et non un fichier : avec `--split-per-abi` il n'existe plus
      # d'`app-release.apk`, mais `app-arm64-v8a-release.apk` et ses deux
      # voisins. Pointer l'ancien nom ne publierait rien, sans erreur.
      - store_artifacts:
          path: build/app/outputs/flutter-apk/
          destination: apk

workflows:
  build-pipeline:
    jobs:
      - build-apk
