version: 2.1

executors:
  flutter-executor:
    docker:
      # Image hébergée sur Docker Hub pour éviter le blocage 403 de GHCR
      - image: plugagrow/flutter:latest

jobs:
  build-apk:
    executor: flutter-executor
    steps:
      - checkout

      # Vérification de l'installation et de l'environnement Flutter
      - run:
          name: Flutter Doctor
          command: flutter doctor -v

      # Récupération des packages et dépendances
      - run:
          name: Get Dependencies
          command: flutter pub get

      # Compilation du fichier APK en mode Release
      - run:
          name: Build APK
          command: flutter build apk --release

      # Exposition du fichier APK téléchargable dans les artefacts CircleCI
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: app-release.apk

workflows:
  build-pipeline:
    jobs:
      - build-apk
