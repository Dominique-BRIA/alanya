version: 2.1

jobs:
  build-apk:
    docker:
      # Image officielle CircleCI avec Android SDK et Java pré-installés
      - image: cimg/android:2024.01
    steps:
      - checkout

      # Installation rapide du SDK Flutter depuis le dépôt officiel
      - run:
          name: Install Flutter SDK
          command: |
            git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter doctor -v

      # Récupération des paquets et dépendances
      - run:
          name: Get Dependencies
          command: |
            source $BASH_ENV
            flutter pub get

      # Compilation de l'APK Release
      - run:
          name: Build APK Release
          command: |
            source $BASH_ENV
            flutter build apk --release

      # Expiration de l'artefact pour le téléchargement
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: app-release.apk

workflows:
  build-pipeline:
    jobs:
      - build-apk
