version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.01
    steps:
      - checkout

      # 1. Installation de Flutter SDK
      - run:
          name: Install Flutter SDK
          command: |
            git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter doctor -v

      # 2. Ajout des outils CMake et Ninja requis pour le NDK / C++
      - run:
          name: Install CMake & Ninja for Android NDK
          command: |
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"

      # 3. Récupération des dépendances Flutter
      - run:
          name: Get Dependencies
          command: |
            source $BASH_ENV
            flutter pub get

      # 4. Compilation de l'APK Release
      - run:
          name: Build APK Release
          command: |
            source $BASH_ENV
            flutter build apk --release

      # 5. Exposition de l'artefact
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: app-release.apk

workflows:
  build-pipeline:
    jobs:
      - build-apk
