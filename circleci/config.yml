version: 2.1

executors:
  flutter-executor:
    docker:
      # Utilisation d'une image Docker pré-configurée avec Flutter et Android SDK
      - image: ghcr.io/cirrusci/flutter:latest

jobs:
  build-apk:
    executor: flutter-executor
    steps:
      - checkout

      # Optionnel : afficher la version de Flutter pour vérifier l'environnement
      - run:
          name: Flutter Doctor
          command: flutter doctor -v

      # Récupération des dépendances
      - run:
          name: Get Dependencies
          command: flutter pub get

      # Compilation de l'APK Release
      - run:
          name: Build APK
          command: flutter build apk --release

      # Sauvegarde de l'APK généré pour pouvoir le télécharger depuis CircleCI
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: app-release.apk

workflows:
  build-pipeline:
    jobs:
      - build-apk