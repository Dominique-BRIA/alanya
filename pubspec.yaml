name: alanya
description: "Alanya — application de messagerie instantanée."
publish_to: "none"
version: 0.1.0+1

# La borne basse n'est plus décorative : les paquets ML Kit de la traduction
# sur l'appareil exigent Dart ^3.12.0 et Flutter >= 3.44.0. L'écrire ici fait
# échouer `pub get` avec un message clair sur une CI restée en arrière, au lieu
# d'un échec de résolution illisible.
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  local_auth: ^2.3.0
  video_thumbnail: ^0.5.6
  photo_manager: ^3.6.4
  image_picker: ^1.1.2
  microsoft_viewer: ^0.0.8
  any_link_preview: ^3.0.3
  open_filex: ^4.7.0
  pdfx: ^2.7.0
  # Rendu SVG. Flutter n'en affiche AUCUN nativement : `Image.memory` ne
  # reconnaît que JPEG, PNG, GIF et WebP. Les avatars générés que l'équipe pose
  # depuis son backend (api.dicebear.com/…/svg) étaient donc invisibles chez
  # nous — rejetés avant même d'être décodés.
  flutter_svg: ^2.0.10
  # Réseau / API
  http: ^1.2.2
  http_parser: ^4.0.2
  # Stockage sécurisé des tokens JWT
  # v10 : corrige le build natif Linux (json.hpp) avec les clang récents.
  flutter_secure_storage: ^10.3.1
  # Gestion d'état
  provider: ^6.1.2
  # Temps réel (messagerie) — client WebSocket pur Dart (web + desktop)
  web_socket_channel: ^3.0.1
  # Sélection de fichiers (images) pour l'envoi de médias
  file_picker: ^8.1.6
  # Mobile : enregistrement vocal, lecture audio, téléchargement
  record: ^7.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  # Lecture vidéo intégrée (mini lecteur in-app)
  video_player: ^2.9.2
  # Lecture PDF intégrée (natif Android/iOS, léger, stable)
  flutter_pdfview: ^1.4.4
  # Sauvegarde dans le stockage public via MediaStore API (Android 10+ safe)
  media_store_plus: ^0.1.3
  # Appels audio/vidéo WebRTC
  flutter_webrtc: ^0.12.12
  permission_handler: ^11.3.1
  # Lecture du répertoire téléphonique natif (Android + iOS)
  flutter_contacts: ^1.1.9+2
  # Champ de saisie du code OTP à 6 chiffres
  pin_code_fields: ^8.0.1
  # Internationalisation / préférences
  shared_preferences: ^2.2.3
  # Notifications locales (canaux + permissions Android)
  flutter_local_notifications: ^18.0.1
  # Notifications push FCM (Firebase Cloud Messaging)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  # Écran d'appel NATIF, plein écran et par-dessus le verrouillage, y compris
  # application tuée. Remplace la notification locale pour les appels entrants :
  # flutter_local_notifications ne sait pas produire une notification de style
  # « appel » (Notification.CallStyle d'Android 12+), celle qui affiche l'avatar
  # et les deux gros boutons. L'écrire en Kotlin aurait demandé de reprendre la
  # construction de la notification et sa réception dans l'isolate d'arrière-plan.
  flutter_callkit_incoming: ^3.1.3
  # Module natif local : ConnectionService Telecom « self-managed ».
  #
  # ⚠️ C'EST LUI QUI REND LA SONNERIE FIABLE, et flutter_callkit_incoming n'est
  # plus qu'un repli. Tant qu'une `Connection` Telecom vit, Android LIE le
  # processus de l'application et ne peut plus le geler — c'est la seule façon
  # de tenir une sonnerie quand l'application est tuée.
  #
  # Le paquet, lui, démarre sa sonnerie à l'affichage de la notification
  # (`CallkitNotificationManager.kt:1033`) au lieu d'attendre le rappel
  # `onShowIncomingCallUi()` de Telecom, qu'il n'implémente pas. Sa sonnerie
  # entre donc en course avec Telecom, qui réclame le focus audio de sonnerie
  # et la coupe : mesuré à 2,21 s sur TECNO KL5. Ce module démarre le son dans
  # ce rappel, et nulle part ailleurs.
  alanya_telecom:
    path: alanya_telecom
  # Base de données locale (cache des messages hors ligne)
  sqflite: ^2.4.1
  path: ^1.9.0
  # Relevé de position des agents rattachés à une entreprise (table `geo`).
  # ⚠️ Le serveur décide QUI est suivi (`/api/me` → `suiviPosition`) : ce paquet
  # n'est sollicité que pour les comptes concernés, jamais pour un particulier.
  geolocator: ^14.0.2
  flutter_foreground_task: ^10.0.0
  # Traduction SUR L'APPAREIL (ML Kit). Remplace les serveurs publics
  # LibreTranslate / MyMemory, à qui le contenu des messages était envoyé en
  # clair. Les modèles sont téléchargés une fois puis utilisés hors ligne :
  # rien ne sort du téléphone, et rien n'est facturé.
  #
  # ⚠️ Les modèles NE SONT PAS dans l'APK — comptez quelques dizaines de Mo par
  # langue, téléchargés à la demande, et il en faut DEUX pour un couple. Le
  # téléchargement doit donc partir d'un geste de l'utilisateur (voir
  # `lib/core/traduction_appareil.dart`).
  #
  # ⚠️ Ces deux paquets exigent `flutter >= 3.44.0` / Dart `^3.12.0` — d'où la
  # contrainte `environment` relevée ci-dessus. Les trois CI sont épinglées à
  # 3.44.6, elles passent ; ne pas y revenir en arrière.
  google_mlkit_translation: ^0.15.1
  google_mlkit_language_id: ^0.15.1
  # Transcodage vidéo AVANT envoi (statuts). Les photos étaient déjà réduites
  # par `core/compression_image.dart` ; les vidéos partaient en pleine
  # définition — 20 Mo la minute en 1080p, pour un statut vu sur un écran de
  # téléphone pendant 60 s au plus.
  #
  # ⚠️ CHOISI POUR CE QU'IL N'EMBARQUE PAS : 100 % natif (MediaCodec), donc pas
  # de FFmpeg — ni les ~20 Mo d'APK, ni la question de licence qui va avec.
  # ffmpeg_kit_flutter, l'autre voie, a été retiré par ses auteurs.
  #
  # ⚠️ Contraintes vérifiées contre les TROIS CI (toutes à Flutter 3.44.6) :
  # le paquet demande `sdk >=3.0.0` / `flutter >=2.0.0`, et son module Android
  # déclare bien un `namespace` — sans lui, AGP 8.11 refuse de bâtir. minSdk 21
  # (l'app est à 24). Son Kotlin a été COMPILÉ ICI contre notre chaîne
  # (Kotlin 2.2.20 / AGP 8.11.1 / Gradle 8.14.3) : `:video_compress:
  # compileDebugKotlin` passe, avec trois avertissements de nullité.
  #
  # ⚠️ Défaut connu de la 3.1.4 : le drapeau interne « compression en cours »
  # n'est pas remis à zéro quand le transcodage échoue. La règle de
  # `core/compression_video.dart` en tient compte — les suivantes repartent
  # simplement sans compression, jamais en erreur.
  video_compress: ^3.1.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

  # Police du style « manuscrit » du formatage de texte (marqueur `).
  #
  # Il était jusqu'ici simulé par du serif en italique — Georgia et Times New
  # Roman, ses replis, n'existent pas sur Android, si bien que le rendu réel
  # était du Noto Serif penché : lisiblement pas de l'écriture manuscrite.
  #
  # Caveat est une vraie cursive, dessinée pour rester lisible en texte courant
  # (contrairement à Pacifico ou Dancing Script, plus décoratives). Fichier à
  # graisse variable, licence SIL OFL 1.1 — voir Caveat-OFL.txt, que la licence
  # impose de distribuer avec la police.
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf

# Icône Android / iOS — source : assets/images/app_icon.png
# Génération : bash ../scripts/setup-app-icon.sh
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  # Blanc, comme la plaque intégrée à app_icon.png. Un fond noir ferait
  # apparaître un cadre sombre autour du logo sur les lanceurs adaptatifs.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
