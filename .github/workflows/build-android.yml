name: Build Android APK

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]
  workflow_dispatch: # permet de lancer manuellement

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java (nécessaire pour Gradle)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'  # adapte à ta version
          channel: 'stable'
          cache: true

      # 4. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Build APK release
      - name: Build APK
        run: flutter build apk --release

      # 6. Upload APK as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alanya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
