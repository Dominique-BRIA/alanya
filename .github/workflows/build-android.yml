name: Build Android APK

on:
  push:
    branches: [test, main, backup/pre-harmonisation-2026-07-24, arena/019f9ff6-alanya]
  pull_request:
    branches: [test, main, backup/pre-harmonisation-2026-07-24, arena/019f9ff6-alanya]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alanya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
