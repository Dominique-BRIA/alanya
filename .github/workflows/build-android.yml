name: Build Android APK

on:
  push:
    branches: [test, main, backup/pre-harmonisation-2026-07-24, arena/019f9ff6-alanya, arena/019fa167-alanya, arena/019fbc55-alanya]
  pull_request:
    branches: [test, main, backup/pre-harmonisation-2026-07-24, arena/019f9ff6-alanya, arena/019fa167-alanya, arena/019fbc55-alanya]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # 30 min ne laissait aucune marge : le build tapait la limite et le job
    # était tué en plein `assembleRelease` (exit 143 = SIGTERM), ce qui se lit
    # comme un plantage alors que c'est une interruption. 45 min laissent de
    # quoi absorber un cache froid sans masquer une vraie régression.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      # Sans ce cache, chaque exécution retélécharge les dépendances Maven et
      # réinstalle les composants du SDK Android — les lignes « Install Android
      # SDK Platform 31 / 33 » et « Install CMake 3.22.1 » du journal, qui se
      # payent en minutes à chaque fois. La clé suit les fichiers de build : ils
      # ne changent pas, le cache resservira.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Signature stable
        # Sans cette étape, `flutter build apk --release` ne trouve pas de clé
        # et retombe sur la clé de DÉBOGAGE. Or celle-ci est fabriquée par la
        # machine qui compile, et un runner est détruit après son build : chaque
        # APK portait donc une signature différente. Android refuse d'installer
        # une mise à jour dont la signature ne correspond pas — d'où
        # l'obligation de désinstaller avant chaque essai, qui faisait perdre la
        # session locale ET créait un appareil de plus dans le registre du
        # compte à chaque fois.
        #
        # L'étape est SANS EFFET tant que le secret n'existe pas : le build
        # retrouve simplement l'ancien comportement. Rien ne casse le jour où
        # quelqu'un compile depuis un fork sans accès aux secrets.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # La garde est DANS le script et non dans un `if:` de l'étape : le
          # contexte `secrets` n'est pas disponible dans les conditions de step.
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Aucune clé de signature configurée : build en signature debug."
            exit 0
          fi
          # `storeFile` est résolu par `file()` DANS le module app : le chemin
          # est donc relatif à android/app, pas à la racine du dépôt.
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/alanya-release.jks
          # Contrôle immédiat : un secret tronqué produirait un fichier illisible
          # et l'erreur ne sortirait que bien plus tard, dans Gradle.
          # -alias est ESSENTIEL, pas seulement -storepass : sans lui le
          # controle passe, et Gradle echoue 17 minutes plus tard sur
          # « No key with alias found ».
          #
          # ⚠️ keytool ENREGISTRE LES ALIAS EN MINUSCULES. Creer la cle avec
          # -alias AlanyaWork la stocke sous « alanyawork », et la valeur du
          # secret doit correspondre a l identique.
          keytool -list -keystore android/app/alanya-release.jks \
                  -alias "$KEY_ALIAS" \
                  -storepass "$STORE_PASSWORD" >/dev/null
          cat > android/key.properties <<PROPS
          storeFile=alanya-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "Clé de signature en place."

      - name: Build APK
        # Le démon Gradle sert à garder une JVM chaude entre deux builds. Un
        # runner est détruit après le sien, donc le démon ne fait qu'occuper de
        # la mémoire — celle-là même qui manquait.
        #
        # L'option passe par l'environnement et NON par la ligne de commande :
        # `--no-daemon` appartient à Gradle, or c'est `flutter build` qui est
        # appelé ici, et il rejette les options qu'il ne connaît pas (exit 64).
        # GRADLE_OPTS traverse Flutter jusqu'au Gradle qu'il lance.
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alanya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
