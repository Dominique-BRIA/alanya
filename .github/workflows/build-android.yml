name: Build Android APK

on:
  push:
    branches: [test, main, backup/pre-harmonisation-2026-07-24, arena/019f9ff6-alanya, arena/019fa167-alanya, arena/019fbc55-alanya]
  pull_request:
    branches: [test, main, backup/pre-harmonisation-2026-07-24, arena/019f9ff6-alanya, arena/019fa167-alanya, arena/019fbc55-alanya]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # 30 min ne laissait aucune marge : le build tapait la limite et le job
    # était tué en plein `assembleRelease` (exit 143 = SIGTERM), ce qui se lit
    # comme un plantage alors que c'est une interruption. 45 min laissent de
    # quoi absorber un cache froid sans masquer une vraie régression.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      # Sans ce cache, chaque exécution retélécharge les dépendances Maven et
      # réinstalle les composants du SDK Android — les lignes « Install Android
      # SDK Platform 31 / 33 » et « Install CMake 3.22.1 » du journal, qui se
      # payent en minutes à chaque fois. La clé suit les fichiers de build : ils
      # ne changent pas, le cache resservira.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        # --no-daemon : le démon Gradle sert à garder une JVM chaude entre deux
        # builds. Un runner est détruit après le sien, donc le démon ne fait
        # qu'occuper de la mémoire — celle-là même qui manquait.
        run: flutter build apk --release --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alanya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
