name: Build Android APK

on:
  push:
    branches: [main, backup/pre-harmonisation-2026-07-24, arena/019f9ff6-alanya, arena/019fa167-alanya, arena/019fbc55-alanya, arena/019fe0e6-alanya, feature/vocal-attente-loop, integration/telecom-vocal, feat/chip-appel-callstyle]
  pull_request:
    branches: [main, backup/pre-harmonisation-2026-07-24, arena/019f9ff6-alanya, arena/019fa167-alanya, arena/019fbc55-alanya, arena/019fe0e6-alanya, feature/vocal-attente-loop, integration/telecom-vocal, feat/chip-appel-callstyle]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # 30 min ne laissait aucune marge : le build tapait la limite et le job
    # était tué en plein `assembleRelease` (exit 143 = SIGTERM), ce qui se lit
    # comme un plantage alors que c'est une interruption. 45 min laissent de
    # quoi absorber un cache froid sans masquer une vraie régression.
    timeout-minutes: 45

    # `actions: write` est le SEUL droit ajouté, et il l'est pour la purge des
    # artefacts ci-dessous. Dès qu'un bloc `permissions` est déclaré, il
    # REMPLACE le jeu par défaut : `contents: read` doit donc y figurer, sans
    # quoi le `checkout` n'aurait plus le droit de lire le dépôt.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      # Sans ce cache, chaque exécution retélécharge les dépendances Maven et
      # réinstalle les composants du SDK Android — les lignes « Install Android
      # SDK Platform 31 / 33 » et « Install CMake 3.22.1 » du journal, qui se
      # payent en minutes à chaque fois. La clé suit les fichiers de build : ils
      # ne changent pas, le cache resservira.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Signature stable
        # Sans cette étape, `flutter build apk --release` ne trouve pas de clé
        # et retombe sur la clé de DÉBOGAGE. Or celle-ci est fabriquée par la
        # machine qui compile, et un runner est détruit après son build : chaque
        # APK portait donc une signature différente. Android refuse d'installer
        # une mise à jour dont la signature ne correspond pas — d'où
        # l'obligation de désinstaller avant chaque essai, qui faisait perdre la
        # session locale ET créait un appareil de plus dans le registre du
        # compte à chaque fois.
        #
        # L'étape est SANS EFFET tant que le secret n'existe pas : le build
        # retrouve simplement l'ancien comportement. Rien ne casse le jour où
        # quelqu'un compile depuis un fork sans accès aux secrets.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # ⚠️ L'ALIAS N'EST PAS UN SECRET, et le traiter comme tel coûtait cher.
          #
          # Un alias est une étiquette : il est écrit en clair dans
          # `key.properties` et lisible dans la signature de n'importe quel APK
          # publié. En revanche, GitHub masque par `***` TOUTE occurrence de la
          # valeur d'un secret dans les journaux — or celle-ci valait « alanya »,
          # c'est-à-dire le nom du dépôt. Résultat : les liens d'artefact
          # sortaient sous la forme
          #   https://github.com/Dominique-BRIA/***/actions/runs/…
          # et renvoyaient une page introuvable. Le nom de l'artefact lui-même
          # s'affichait « ***-apk ».
          #
          # Écrit en clair ici, il redevient lisible partout. Le SECRET du même
          # nom doit être SUPPRIMÉ des réglages du dépôt : tant qu'il existe et
          # qu'il est référencé, le masquage revient.
          KEY_ALIAS: alanya
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # La garde est DANS le script et non dans un `if:` de l'étape : le
          # contexte `secrets` n'est pas disponible dans les conditions de step.
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Aucune clé de signature configurée : build en signature debug."
            exit 0
          fi
          # `storeFile` est résolu par `file()` DANS le module app : le chemin
          # est donc relatif à android/app, pas à la racine du dépôt.
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/alanya-release.jks
          # Contrôle immédiat : un secret tronqué produirait un fichier illisible
          # et l'erreur ne sortirait que bien plus tard, dans Gradle.
          # -alias est ESSENTIEL, pas seulement -storepass : sans lui le
          # controle passe, et Gradle echoue 17 minutes plus tard sur
          # « No key with alias found ».
          #
          # ⚠️ L alias doit reprendre EXACTEMENT ce que renvoie
          #   keytool -list -keystore alanya-release.jks
          # et non ce qu on croit avoir tape a la creation. Un magasin PKCS12
          # preserve la casse ; un JKS, lui, met tout en minuscules. Dans les
          # deux cas, seule la sortie de keytool fait foi.
          keytool -list -keystore android/app/alanya-release.jks \
                  -alias "$KEY_ALIAS" \
                  -storepass "$STORE_PASSWORD" >/dev/null
          cat > android/key.properties <<PROPS
          storeFile=alanya-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "Clé de signature en place."

      - name: Build APK
        # Le démon Gradle sert à garder une JVM chaude entre deux builds. Un
        # runner est détruit après le sien, donc le démon ne fait qu'occuper de
        # la mémoire — celle-là même qui manquait.
        #
        # L'option passe par l'environnement et NON par la ligne de commande :
        # `--no-daemon` appartient à Gradle, or c'est `flutter build` qui est
        # appelé ici, et il rejette les options qu'il ne connaît pas (exit 64).
        # GRADLE_OPTS traverse Flutter jusqu'au Gradle qu'il lance.
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          # Clé des tuiles de carte (bulle « position »). Secret du dépôt, car
          # les deux dépôts de ce projet sont PUBLICS : une clé dans le code y
          # serait ramassée par des robots en quelques minutes.
          #
          # ⚠️ Secret ABSENT = APK sans carte, et le build RÉUSSIT quand même.
          # La bulle retombe alors sur une vignette sobre (repère +
          # coordonnées) : c'est visible, mais ça ne casse rien.
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: flutter build apk --release --dart-define=MAPTILER_KEY=$MAPTILER_KEY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alanya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      # Ne garder que les 5 APK les plus récents.
      #
      # 🔴 APRÈS L'ENVOI, ET JAMAIS AVANT. Purger d'abord aurait supprimé les
      # anciens APK au tout début d'un build qui peut encore échouer — on se
      # retrouverait sans rien à installer. Ici, on ne jette qu'une fois le
      # nouveau déposé.
      #
      # `if: success()` est donc redondant avec l'ordre des étapes, mais il dit
      # l'intention : cette étape n'a de sens que si l'APK est bien là.
      #
      # ⚠️ LE RUN COURANT EST EXCLU DU TRI, pas seulement compté : l'API liste
      # les artefacts du dépôt entier, et rien ne garantit que celui qu'on vient
      # de déposer y soit déjà visible. On garde donc les 4 plus récents des
      # AUTRES runs — soit 5 APK en tout avec celui-ci.
      #
      # `retention-days: 7` reste le filet : si cette étape échoue un jour, les
      # artefacts finissent quand même par expirer.
      - name: Ne garder que les 5 derniers APK
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const A_GARDER = 5;
            const { owner, repo } = context.repo;

            const artefacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            );

            const miens = artefacts
              .filter((a) => a.name === 'alanya-apk'
                          && !a.expired
                          && a.workflow_run?.id !== context.runId)
              // Du plus récent au plus ancien.
              .sort((x, y) => new Date(y.created_at) - new Date(x.created_at));

            const aJeter = miens.slice(A_GARDER - 1);
            if (aJeter.length === 0) {
              core.info(`Rien à purger : ${miens.length + 1} APK conserves.`);
              return;
            }

            for (const a of aJeter) {
              try {
                await github.rest.actions.deleteArtifact(
                  { owner, repo, artifact_id: a.id },
                );
                core.info(`supprimé : #${a.id} du ${a.created_at}`);
              } catch (e) {
                // Un artefact déjà expiré ou supprimé entre la liste et ici ne
                // doit pas faire échouer un build par ailleurs réussi.
                core.warning(`#${a.id} non supprimé : ${e.message}`);
              }
            }
            core.info(`${aJeter.length} ancien(s) APK supprime(s).`);
